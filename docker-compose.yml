services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radtik-app
    env_file:
      - .env
    ports:
      - "8080:8080"
      # Optional: map host port 80 (may require admin on some systems)
      # - "80:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # Required for HTTP-only access (no TLS in container); set false behind nginx/HTTPS terminator
      - RADTIK_INSECURE_HTTP=true
      - SQL_SERVER_HOST=radtik-sqlserver
      - SQL_SERVER_PORT=1433
      - ConnectionStrings__MyDBConnection=Server=radtik-sqlserver,1433;Database=RadTikDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Connection Timeout=120;
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - radtik-net
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: radtik-sqlserver
    env_file:
      - .env
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # Port open = SQL Server accepting TCP (avoids sqlcmd path differences across image tags)
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - radtik-net
    restart: unless-stopped

networks:
  radtik-net:
    driver: bridge

volumes:
  sqlserver-data:
