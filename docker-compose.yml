services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radatik-app
    env_file:
      - .env
    ports:
      - "8080:8080"
      # Optional: map host port 80 (may require admin on some systems)
      # - "80:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # Required for HTTP-only access (no TLS in container); set false behind nginx/HTTPS terminator
      - RADATIK_INSECURE_HTTP=true
      - RADATIK_DATA_PROTECTION_KEYS_PATH=/var/radatik/dp-keys
      - SQL_SERVER_HOST=radatik-sqlserver
      - SQL_SERVER_PORT=1433
      - ConnectionStrings__MyDBConnection=Server=radatik-sqlserver,1433;Database=RadaTikDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Connection Timeout=120;
    volumes:
      # Overlay the baked-in entrypoint so a host-side script fix takes effect without a full image rebuild.
      - ./docker-entrypoint.sh:/docker-entrypoint.sh:ro
      # Keep encryption keys across image rebuilds so MikroTik server passwords stay readable.
      - /opt/radatik/dp-keys:/var/radatik/dp-keys
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - radatik-net
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: radatik-sqlserver
    env_file:
      - .env
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - /opt/mssql/data:/var/opt/mssql/data
      - /opt/mssql/log:/var/opt/mssql/log
      - /opt/mssql/secrets:/var/opt/mssql/secrets
      - /opt/backups:/var/opt/mssql/backup
    healthcheck:
      # Port open = SQL Server accepting TCP (avoids sqlcmd path differences across image tags)
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - radatik-net
    restart: unless-stopped

networks:
  radatik-net:
    driver: bridge
