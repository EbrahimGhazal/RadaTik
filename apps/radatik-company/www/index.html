<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RadaTik</title>
    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            font-family: Cairo, Tajawal, sans-serif;
            background: linear-gradient(160deg, #0f766e 0%, #115e59 100%);
            color: #fff;
        }
        .wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem;
            box-sizing: border-box;
            text-align: center;
        }
        img { width: 88px; height: 88px; border-radius: 22px; background: #fff; padding: 8px; }
        h1 { margin: 1rem 0 0.35rem; font-size: 1.6rem; }
        p { margin: 0; opacity: 0.9; }
    </style>
</head>
<body>
    <div class="wrap">
        <img src="icon.png" alt="RadaTik" />
        <h1>RadaTik</h1>
        <p>بوابة مدير الشركة</p>
    </div>
</body>
</html>
