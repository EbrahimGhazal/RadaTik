name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install EF CLI
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ef --version 9.0.10
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "radatik-web/package-lock.json"

      - name: Install frontend dependencies
        working-directory: radatik-web
        run: npm ci

      - name: Lint frontend
        working-directory: radatik-web
        run: npm run lint

      - name: Build frontend
        working-directory: radatik-web
        run: npm run build

      - name: Test frontend
        working-directory: radatik-web
        run: npm run test:run

      - name: Restore backend
        run: dotnet restore RadaTik/RadaTik.csproj

      - name: Build backend
        run: dotnet build RadaTik/RadaTik.csproj --configuration Release --no-restore

      - name: Build tests
        run: dotnet build RadaTik.Tests/RadaTik.Tests.csproj --configuration Release --no-restore

      - name: Validate EF migrations are in sync
        run: dotnet ef migrations has-pending-model-changes --project RadaTik/RadaTik.csproj --startup-project RadaTik/RadaTik.csproj --configuration Release

      - name: Run tests
        run: dotnet test RadaTik.Tests/RadaTik.Tests.csproj --configuration Release --no-build

      - name: Audit frontend dependencies
        working-directory: radatik-web
        run: npm audit --audit-level=high

      - name: Check backend dependency vulnerabilities
        run: dotnet list RadaTik/RadaTik.csproj package --vulnerable --include-transitive
